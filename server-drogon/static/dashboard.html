<!DOCTYPE html>
<html>
<head>
    <title>Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .controls { background: white; border-radius: 12px; padding: 15px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .controls label { font-weight: 500; color: #555; }
        .controls select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { color: #666; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 48px; font-weight: bold; }
        .value span { font-size: 24px; color: #888; }
        .status-ok { color: #22c55e; }
        .status-warning { color: #f59e0b; }
        .status-critical { color: #ef4444; }
        .alert { background: #fee2e2; border-left: 4px solid #ef4444; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .alert.warning { background: #fef3c7; border-left-color: #f59e0b; }
        .alert button { background: #22c55e; color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .alert button:hover { background: #16a34a; }
        canvas { max-height: 300px; width: 100%; }
        .loading { text-align: center; padding: 20px; color: #888; }
        .agent-badge { background: #e9ecef; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #495057; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 System Monitoring</h1>
        
        <div class="controls">
            <label>🤖 Select Agent:</label>
            <select id="agentSelect">
                <option value="all">📡 All Agents</option>
            </select>
            <span id="agentInfo" class="agent-badge"></span>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2>CPU Usage</h2>
                <div class="value" id="cpuValue">0<span>%</span></div>
            </div>
            <div class="card">
                <h2>Memory Usage</h2>
                <div class="value" id="memValue">0<span>%</span></div>
            </div>
        </div>
        
        <div class="card" style="margin-bottom: 20px;">
            <h2>⚠️ Active Alerts</h2>
            <div id="alertsList">Loading...</div>
        </div>
        
        <div class="card" style="margin-bottom: 20px;">
            <h2>📈 CPU Usage History</h2>
            <canvas id="cpuChart"></canvas>
        </div>
        
        <div class="card">
            <h2>📈 Memory Usage History</h2>
            <canvas id="memChart"></canvas>
        </div>
    </div>
    
    <script>
        let cpuChart, memChart;
        let agents = [];
        let currentAgentId = 'all';
        
        function initCharts() {
            cpuChart = new Chart(document.getElementById('cpuChart'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'CPU %', data: [], borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' } } }
            });
            
            memChart = new Chart(document.getElementById('memChart'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Memory %', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' } } }
            });
        }
        
        function updateDisplay(cpu, memory, agentName = '') {
            document.getElementById('cpuValue').innerHTML = Math.round(cpu) + '<span>%</span>';
            document.getElementById('memValue').innerHTML = Math.round(memory) + '<span>%</span>';
            let cpuElem = document.getElementById('cpuValue');
            let memElem = document.getElementById('memValue');
            cpuElem.className = cpu > 80 ? 'value status-critical' : (cpu > 60 ? 'value status-warning' : 'value status-ok');
            memElem.className = memory > 85 ? 'value status-critical' : (memory > 70 ? 'value status-warning' : 'value status-ok');
            document.getElementById('agentInfo').textContent = agentName ? `Current: ${agentName}` : '';
        }
        
        async function loadAgents() {
            try {
                const res = await fetch('/api/agents');
                agents = await res.json();
                const select = document.getElementById('agentSelect');
                select.innerHTML = ''; // очищаем
                agents.forEach(agent => {
                    const option = document.createElement('option');
                    option.value = agent.id;
                    option.textContent = `${agent.name} (${agent.api_key.substring(0, 8)}...)`;
                    select.appendChild(option);
                });
                // Автоматически выбираем первого агента
                if (agents.length > 0) {
                    select.value = agents[0].id;
                    loadData();
                }
                } catch(e) { console.error('Failed to load agents:', e); }
        }
        
        async function loadAlerts() {
            try {
                const res = await fetch('/api/alerts');
                const alerts = await res.json();
                const container = document.getElementById('alertsList');
                if (alerts.length === 0) {
                    container.innerHTML = '<div style="color: #888; padding: 12px;">✓ No active alerts</div>';
                    return;
                }
                container.innerHTML = alerts.map(a => `
                    <div class="alert ${a.type === 'CPU_HIGH' ? 'warning' : ''}">
                        <div><strong>${a.type}</strong>: ${a.message}</div>
                        <button onclick="resolveAlert(${a.id})">Resolve</button>
                    </div>
                `).join('');
            } catch(e) { 
                console.error(e);
                document.getElementById('alertsList').innerHTML = '<div style="color: #ef4444;">Failed to load alerts</div>';
            }
        }
        
        async function resolveAlert(id) {
            await fetch(`/api/alerts/${id}/resolve`, { method: 'POST' });
            loadAlerts();
        }
        
        async function loadData() {
            try {
                currentAgentId = document.getElementById('agentSelect').value;
                let url = '/api/metrics/history';
                if (currentAgentId !== 'all') {
                    url = `/api/metrics/${currentAgentId}/history`;
                }
                const res = await fetch(url);
                const data = await res.json();
        
                // Если нет данных — очищаем графики и показываем сообщение
                if (data.length === 0) {
                    cpuChart.data.labels = [];
                    cpuChart.data.datasets[0].data = [];
                    memChart.data.labels = [];
                    memChart.data.datasets[0].data = [];
                    cpuChart.update();
                    memChart.update();
                    updateDisplay(0, 0);
                    document.getElementById('alertsList').innerHTML = '<div style="color: #888;">No data for this agent</div>';
                    return;
                }
        
                const labels = data.map(d => new Date(d.timestamp).toLocaleTimeString());
                const cpuData = data.map(d => d.cpu);
                const memData = data.map(d => d.memory);
        
                cpuChart.data.labels = labels;
                cpuChart.data.datasets[0].data = cpuData;
                memChart.data.labels = labels;
                memChart.data.datasets[0].data = memData;
                cpuChart.update();
                memChart.update();
        
                const last = data[data.length-1];
                updateDisplay(last.cpu, last.memory, last.agent_name);
                loadAlerts();
            } catch(e) { 
                console.error('Error loading data:', e);
            }
        }
        
        initCharts();
        loadAgents();
        loadAlerts();
        loadData();
        setInterval(() => { loadAlerts(); loadData(); }, 5000);
        document.getElementById('agentSelect').onchange = () => loadData();
    </script>
</body>
</html>
